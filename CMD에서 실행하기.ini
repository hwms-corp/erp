CMD에서 실행하기
1. CMD 열기 → 프로젝트 폴더로 이동

cd /d D:\Cursor\erp-test


2. erp-test만 올리기

scripts\push-erp-test.cmd
커밋 메시지 지정:

scripts\push-erp-test.cmd "feat: 검색 기간 변경"


3. erp만 올리기

scripts\push-erp.cmd
scripts\push-erp.cmd "feat: 검색 기간 변경"


4. erp-test + erp 둘 다 올리기

scripts\push-all.cmd

scripts\push-all.cmd "feat: 검색 기간 변경"